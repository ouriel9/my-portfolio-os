# ── First-paint theme (follows the device) ──────────────────────────────────
# NO forced `base`: with both [theme.light] and [theme.dark] defined, Streamlit
# paints the NATIVE shell (incl. the canvas st.dataframe grid, dropdowns, inputs —
# things app CSS cannot recolour per-session) to match the device's
# prefers-color-scheme. So a LIGHT phone gets light tables, a DARK phone gets dark.
# The app's own theme toggle (Appearance) then drives the premium CSS overlay on top.
# The earlier all-white sidebar was the data-pp-collapsed content-hide race (fixed
# r17) + a forced #ffffff — NOT this base — so following the device is safe now.
[theme]
primaryColor = "#6366f1"
font = "sans serif"

[theme.light]
backgroundColor = "#f6f8fd"
secondaryBackgroundColor = "#eef2fb"
textColor = "#0f172a"

[theme.light.sidebar]
backgroundColor = "#f3f5fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
borderColor = "#e2e8f0"

[theme.dark]
backgroundColor = "#0b1120"
secondaryBackgroundColor = "#0f172a"
textColor = "#e2e8f0"

[theme.dark.sidebar]
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"
borderColor = "#1e293b"

[server]
runOnSave = true
headless = true
# ── Mobile / LAN access stability ──────────────────────────────────────
# Disable CORS so phones on the same Wi-Fi can open the app without
# the browser rejecting the WebSocket handshake.
enableCORS = false
# Disable XSRF token checks — these can cause the mobile browser to fail
# on reconnect after the screen dims / app is backgrounded.
enableXsrfProtection = false
# Raise message-size cap (default 200 MB) — large DataFrames or chart
# payloads would otherwise silently drop the WebSocket on mobile.
maxMessageSize = 200
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
# Production: never leak a raw traceback / local file path to the UI — show a
# generic message instead. (Full errors still go to the server log.)
showErrorDetails = "none"
